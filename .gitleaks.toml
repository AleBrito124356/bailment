# gitleaks configuration.
#
# The allowlist below is deliberately narrow. A repository whose secret scanner is muted for
# a whole directory has a secret scanner in name only, and the directory it gets muted for is
# invariably `tests/` -- which is where fixtures live, and where a real credential somebody
# pasted while debugging also lives.
#
# So there are no path-based exemptions here at all. Every allowlist entry is the exact
# literal string being permitted, and the comment above it says why that literal cannot be a
# live credential. Allowing a specific constant repository-wide is tighter than allowing a
# whole file, not looser: if one of these strings ever appears somewhere new, it is still the
# same harmless constant, whereas a muted file hides whatever lands in it next.

[extend]
useDefault = true

# --------------------------------------------------------------------------------------
# A rule the defaults do not have
# --------------------------------------------------------------------------------------

[[rules]]
# bailment's own key format. Fernet keys are 32 url-safe base64 bytes and gitleaks ships no
# rule for them, so this adds one: if a real key is ever committed to a bailment setting,
# this is what catches it. Requiring the assignment context keeps it off every base64 blob
# in a lockfile.
#
# The two places a demo key legitimately appears -- docker-compose.yml and the
# DEMO_ENCRYPTION_KEY constant it is checked against -- carry an inline `gitleaks:allow`
# comment, which is the mechanism meant for exactly one known line rather than a pattern.
id = "bailment-fernet-key"
description = "A Fernet encryption key assigned to a bailment setting"
regex = '''(?i)(BAILMENT_(?:PREVIOUS_)?ENCRYPTION_KEYS?)\s*[:=]\s*["']?([A-Za-z0-9_-]{43}=)'''
secretGroup = 2
keywords = [
  "BAILMENT_ENCRYPTION_KEY",
  "BAILMENT_PREVIOUS_ENCRYPTION_KEYS",
]

# --------------------------------------------------------------------------------------
# Fixtures that have to look like credentials in order to prove they get redacted
# --------------------------------------------------------------------------------------

[allowlist]
description = "Specific published or synthetic constants that cannot be live credentials"

regexes = [
  # AWS's own documentation example access key id, published by AWS in their docs for this
  # exact purpose.
  '''AKIAIOSFODNN7EXAMPLE''',

  # Synthetic Slack bot token: sequential digits and a run of the alphabet.
  '''xoxb-1234567890-abcdefghij''',

  # tests/test_secrets.py feeds known token shapes to the log redactor and asserts each one
  # comes back masked, so they have to be recognisable as credentials or the test proves
  # nothing. Every body below is literally the lowercase alphabet.
  '''(sk-|ghp_|github_pat_)abcdefghijklmnopqrstuvwxyz[0-9]*''',
  '''AIzaSyA1234567890abcdefghijklmnopqrstu''',

  # jwt.io's sample token. The payload is {"sub":"1"} and the key is the string "secret".
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxIn0\.dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW1g''',

  # The compose stack's Postgres password, which is the same word as the database and the
  # user and is reachable only from inside the compose network. Anyone changing it has to
  # change it in two places, which is where they will notice it was never a secret.
  '''postgresql\+asyncpg://bailment:bailment@db:5432/bailment''',

  # The placeholder in .env.example. Not a key; the shape of the hole where one goes.
  '''fernet_key_REPLACE_ME_run_bailment_keygen=''',
]
