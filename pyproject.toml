[project]
name = "bailment"
version = "0.1.0"
description = "A provisioning broker that hands AI agents capabilities instead of credentials, with time-boxed leases that clean up after themselves."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Alejandro Brito Olivera" }]
keywords = [
    "platform-engineering",
    "provisioning",
    "mcp",
    "model-context-protocol",
    "open-service-broker",
    "infrastructure",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "structlog>=24.4",
    "typer>=0.15",
    "rich>=13.9",
    "mcp>=1.2",
    "cryptography>=44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.14",
    # PyYAML ships no annotations, so `import yaml` fails mypy --strict without stubs.
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/AleBrito124356/bailment"
Repository = "https://github.com/AleBrito124356/bailment"
Issues = "https://github.com/AleBrito124356/bailment/issues"

[project.scripts]
bailment = "bailment.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bailment"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:bailment.*"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bailment"]
mypy_path = "src"
